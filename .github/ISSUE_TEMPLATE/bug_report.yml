name: Bug report
description: Registre uma falha encontrada durante os testes.
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Acesse...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options: [Baixa, Média, Alta, Crítica]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Homologação — Chrome 127 — Windows 11
